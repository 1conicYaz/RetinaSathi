experiment:
  name: v3_3_retfound_mae_naturecfp_frozen_multi_head
  seed: 26038
  architecture: retfound_mae_naturecfp
  foundation_provenance: artifacts/retfound_mae_naturecfp_provenance.json
  validation_fold: 0
  calibration_fold: 1
data:
  manifest: runs/v3_data/v3_initial_manifest.csv
  validation_report: artifacts/v3_manifest_validation.json
preprocessing:
  retinal_crop: true
  remove_black_border: true
  aspect_ratio_safe_resize: true
  enhancement: ben_graham
  color_normalization: false
  input_size: 224
augmentation:
  horizontal_flip_probability: 0.5
  rotation_degrees: 12
  brightness: 0.12
  contrast: 0.12
  saturation: 0.08
  translation_fraction: 0.03
training:
  epochs: 20
  batch_size: 2
  gradient_accumulation: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  early_stopping_patience: 5
  mixed_precision: auto
  num_workers: 0
  dropout: 0.25
  ordinal_loss_weight: 1.0
  referable_loss_weight: 1.5
  nominal_loss_weight: 0.75
  nominal_label_smoothing: 0.05
  joint_source_grade_sampling: true
  sampler_max_weight_ratio: 10.0
  nominal_weight_minimum: 0.5
  nominal_weight_maximum: 3.0
  gradient_clip_norm: 2.0
  tiny_overfit_per_grade: 4
  tiny_overfit_epochs: 12
  tiny_overfit_learning_rate: 0.005
selection:
  checkpoint_policy: weighted_validation_composite
  checkpoint_weights:
    referable_auprc: 0.45
    qwk: 0.25
    macro_f1: 0.20
    minimum_grade_1_2_4_recall: 0.10
  minimum_calibration_sensitivity: 0.95
  minimum_calibration_specificity: 0.85
  minimum_source_sensitivity: 0.90
  minimum_source_specificity: 0.85
  official_test_locked: true
